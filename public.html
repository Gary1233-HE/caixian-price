*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC','PingFang TC',sans-serif;background:#d0d8e0;color:#1a1a2e;-webkit-font-smoothing:antialiased;min-height:100vh;padding:20px}

.page{width:794px;min-height:1123px;margin:0 auto;background:#fff;padding:4px 5px 5px;box-shadow:0 4px 24px rgba(0,0,0,.18)}

/* Header */
.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.shop-name{font-size:34px;font-weight:900;color:#1a5276;line-height:1}
.shop-info{font-size:11px;color:#555;margin-top:6px;line-height:1.9}
.date-block{text-align:right}
.date-label{font-size:14px;font-weight:900;color:#1a5276;letter-spacing:.05em}
.date-value{font-size:11px;color:#555;margin-top:4px}
.date-note{font-size:10px;color:#c0392b;margin-top:2px}
.updated{font-size:9px;color:#aaa;margin-top:2px}

/* 四欄 Grid */
.price-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1.5px solid #2980b9;border-radius:4px;overflow:hidden}
.price-col{border-right:1.5px solid #2980b9;display:flex;flex-direction:column}
.price-col:last-child{border-right:none}

.cat-hdr{padding:5px 8px;font-size:12px;font-weight:900;color:#fff;letter-spacing:.04em}
.col-lbl{display:flex;justify-content:space-between;padding:3px 8px;font-size:10px;font-weight:700;color:#666;border-bottom:1px solid #d6eaf8;background:#eaf4fd}
.item{display:flex;justify-content:space-between;align-items:center;padding:3px 8px;border-bottom:1px solid #eaf4fd;font-size:12px}
.item:last-child{border-bottom:none}
.item:nth-child(even){background:#f8fbff}
.item-name{color:#1a1a2e;flex:1;padding-right:3px}
.item-price{white-space:nowrap;font-size:12px;color:#1a2a4a}
.item-price.up{color:#c0392b;font-weight:700}
.item-price.down{color:#1565c0;font-weight:700}
.arrow{font-size:10px}
.cat-divider{border-top:1.5px solid #2980b9}

.footer{margin-top:10px;text-align:center;font-size:10px;color:#888;line-height:2}
.footer-bold{font-weight:900;color:#1a5276;font-size:12px}

#xls-btn{position:fixed;top:16px;right:130px;z-index:999;background:#217346;color:#fff;border:none;border-radius:6px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);font-family:inherit}
#xls-btn:hover{background:#1a5c38}
#dl-btn{position:fixed;top:16px;right:16px;z-index:999;background:#1a5276;color:#fff;border:none;border-radius:6px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);font-family:inherit}
#dl-btn:hover{background:#154360}
@media print{#dl-btn,#xls-btn{display:none}body{background:#fff;padding:0}.page{box-shadow:none;width:100%}}
@media(max-width:600px){body{padding:0}.page{width:100%;padding:14px 10px}.price-grid{grid-template-columns:1fr 1fr}.price-col:nth-child(2){border-right:none}.price-col:nth-child(3){border-top:1.5px solid #2980b9}.price-col:nth-child(4){border-top:1.5px solid #2980b9;border-right:none}}
.loading{text-align:center;padding:60px;color:#888}

function today() {
  const d = new Date();
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── 計算售價 ────────────────────────────────────────────────────────────────

// 散售累進計算
function retailProgressiveAddon(base) {
  if (base <= 25) return base + 10;
  let rate;
  if (base <= 99)  rate = 1.45;
  else if (base <= 199) rate = 1.40;
  else rate = 1.35;
  const raw = base * rate;
  const b = Math.floor(raw / 10) * 10;
  const ones = raw - b;
  const targets = [0, 3, 5, 8, 10];
  const closest = targets.reduce((a, t) => Math.abs(ones - a) <= Math.abs(ones - t) ? a : t);
  return b + (closest === 10 ? 10 : closest);
}
function progressiveAddon(cost, rate, fixed) {
  rate  = rate  || 0.30;
  fixed = fixed || 100;
  if (cost <= 330) return fixed;
  const raw = cost * rate;
  const base = Math.floor(raw / 100) * 100;
  const ones = raw - base;
  const targets = [0, 30, 50, 80, 100];
  const closest = targets.reduce((a, b) => Math.abs(ones - a) <= Math.abs(ones - b) ? a : b);
  return base + (closest === 100 ? 100 : closest);
}

function calcSell(item, all) {
  if (item.cat === 'c4' && item.srcId) return cutPrice(item, all);
  const cost = Number(item.cost)||0;
  if (!cost) return Number(item.price)||0;
  if (item.type==='manual')      return Number(item.price)||0;
  if (item.type==='fixed')       return cost + (Number(item.markup)||0);
  if (item.type==='progressive')        return cost + progressiveAddon(cost, 0.30, 100);
  if (item.type==='progressive-20')     return cost + progressiveAddon(cost, 0.20, 70);
  if (item.type==='progressive-15')     return cost + progressiveAddon(cost, 0.15, 50);
  if (item.type==='retail-progressive') return retailProgressiveAddon(cost);
  return Math.round(cost * (1 + (Number(item.markup)||0)/100));
}

function cutPrice(item, all) {
  const src = all.find(i => i.id === item.srcId);
  if (!src) return 0;
  if ((item.cutType||'whole') === 'whole') {
    const sp = calcSell(src, all);
    return sp ? Math.round(sp + (Number(item.cutFee)||0)) : 0;
  }
  // 散切：src 可能是整件切或原料，直接用其售價
  const base = calcSell(src, all);
  if (!base) return 0;
  const w = Number(item.srcWeight)||1;
  const y = Number(item.cutYield)||1;
  const a = Number(item.cutAddon)||0;
  return Math.round((base/w)/y + a);
}

// ── 建立品項列 ───────────────────────────────────────────────────────────────
function itemRow(item, all) {
  const sp   = calcSell(item, all);
  if (!sp) return ''; // 沒有金額不顯示
  const cls  = item.trend==='up' ? ' up' : item.trend==='down' ? ' down' : '';
  const arrow = item.trend==='up'   ? `<span class="arrow">↑</span>`
              : item.trend==='down' ? `<span class="arrow">↓</span>` : '';
  return `<div class="item"><span class="item-name">${esc(item.name)}</span><span class="item-price${cls}">${sp}${arrow}</span></div>`;
}

// ── 建立類別區塊 ─────────────────────────────────────────────────────────────
function catBlock(cat, all, divider) {
  const rows = all.filter(i => i.cat===cat.id && i.visible!==false && calcSell(i, all) > 0);
  if (!rows.length) return '';
  return `
    ${divider ? '<div class="cat-divider"></div>' : ''}
    <div class="cat-hdr" style="background:${esc(cat.color)}">${esc(cat.name)}</div>
    <div class="col-lbl"><span>品項</span><span>單價</span></div>
    ${rows.map(i => itemRow(i, all)).join('')}`;
}

// ── 渲染頁面 ─────────────────────────────────────────────────────────────────
let all_items_cache = [];
let meta = {};

function render(data) {
  meta = data.meta  || {};
  const all  = data.items || [];
  all_items_cache = all;
  const upd  = data.updatedAt ? new Date(data.updatedAt).toLocaleString('zh-TW') : '';

  // 欄位定義
  const COL_LEFT  = [{id:'c4',name:'🔪 蔬菜截切',color:'#1a7a6e'},{id:'c1',name:'🥬 葉菜類',color:'#1e8449'}];
  const COL_MID   = [{id:'c2',name:'🍈 瓜果類',  color:'#d4ac0d'}];
  const COL_RIGHT = [{id:'c3',name:'🍄 菇與其他',color:'#7b241c'}];

  function buildCol(cats) {
    return cats.map((cat, i) => catBlock(cat, all, i > 0)).join('');
  }

  document.getElementById('app').innerHTML = `
    <div class="hdr">
      <div>
        <div class="shop-name">${esc(meta.name||'採鮮農產行')}</div>
        <div class="shop-info">
          聯絡人：${esc(meta.contact||'')}<br>
          手機：${esc(meta.phone||'')}<br>
          LINE：${esc(meta.line||'')}
        </div>
      </div>
      <div class="date-block">
        <div class="date-label">當日報價單</div>
        <div class="date-value">報價日期：${today()}</div>
        <div class="date-note">※ 本報價單以當日行情價為準</div>
        ${upd ? `<div class="updated">最後更新：${upd}</div>` : ''}
      </div>
    </div>

    <div class="price-grid">
      <div class="price-col">${buildCol([{id:'c4',name:'🔪 蔬菜截切',color:'#1a7a6e'}])}</div>
      <div class="price-col">${buildCol([{id:'c1',name:'🥬 葉菜類',color:'#1e8449'}])}</div>
      <div class="price-col">${buildCol([{id:'c2',name:'🍈 瓜果類',color:'#d4ac0d'}])}</div>
      <div class="price-col">${buildCol([{id:'c3',name:'🍄 菇與其他',color:'#7b241c'}])}</div>
    </div>

    <div class="footer">
      <div>※ ${esc(meta.note||'價格以當日市場行情為準，如有異動恕不另行通知')}</div>
      <div class="footer-bold">感謝您的支持與愛護 🙏</div>
    </div>`;
}

// ── Firebase 載入 ────────────────────────────────────────────────────────────
async function load() {
  try {
    const app = firebase.apps[0] || firebase.initializeApp({
      apiKey: FB_API_KEY, projectId: FB_PROJECT_ID,
      authDomain: `${FB_PROJECT_ID}.firebaseapp.com`
    });
    app.firestore().collection('price_board').doc('current').onSnapshot(snap => {
      if (snap.exists) render(snap.data());
      else document.getElementById('app').innerHTML = '<div class="loading">尚無報價資料</div>';
    }, err => {
      document.getElementById('app').innerHTML = `<div class="loading">載入失敗：${err.message}</div>`;
    });
  } catch(e) {
    document.getElementById('app').innerHTML = `<div class="loading">錯誤：${e.message}</div>`;
  }
}

// ── 匯出 Excel（三欄版型，仿原始報價單） ─────────────────────────────────
async function exportExcel() {
  const btn = document.getElementById('xls-btn');
  btn.textContent = '⏳ 產生中…'; btn.disabled = true;
  try {
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('工作表1', {
      pageSetup: {
        paperSize: 9,           // A4
        orientation: 'portrait',
        fitToPage: true,
        scale: 92,
        horizontalCentered: true,
        verticalCentered: true,
        margins: {
          left: 0.118, right: 0.118,
          top: 0.197, bottom: 0.197,
          header: 0, footer: 0
        }
      }
    });

    const FONT = { name: '新細明體', size: 16 };
    const VALIGN = { vertical: 'middle' };
    const FONT_B = { name: '新細明體', size: 16, bold: true };
    const FONT_TITLE = { name: '新細明體', size: 24, bold: true };

    // 欄寬
    ws.columns = [
      { width: 26 }, { width: 9 },
      { width: 26 }, { width: 9 },
      { width: 26 }, { width: 9 },
    ];

    // 列高（跟原始檔一致）
    ws.getRow(1).height = 41.25;  // 55px
    ws.getRow(2).height = 30;     // 40px
    ws.getRow(3).height = 30;
    ws.getRow(4).height = 30;
    ws.getRow(5).height = 30;
    ws.getRow(6).height = 28.5;

    // ── 表頭 ──
    ws.mergeCells('A1:F1');
    const t = ws.getCell('A1');
    t.value = '採 鮮 農 產 行';
    t.font = FONT_TITLE;
    t.alignment = { horizontal: 'center', vertical: 'middle' };

    const d = new Date();
    const dateStr = `報價日期：${d.getMonth()+1}月${d.getDate()}日`;

    const hdrRows = [
      ['A2:C2', `聯絡人：${meta.contact || ''}`, 'left',  'D2:F2', dateStr,      'center'],
      ['A3:C3', `手　機：${meta.phone   || ''}`, 'left',  'D3:F3', '官方LINE：', 'left'],
      ['A4:C4', 'PS：本報價單以當日行情報價',    'left',  'D4:F4', meta.line || '', 'left'],
    ];
    hdrRows.forEach(([lm, lv, la, rm, rv, ra]) => {
      ws.mergeCells(lm);
      const lc = ws.getCell(lm.split(':')[0]);
      lc.value = lv; lc.font = FONT_B; lc.alignment = { horizontal: la };
      ws.mergeCells(rm);
      const rc = ws.getCell(rm.split(':')[0]);
      rc.value = rv; rc.font = FONT_B; rc.alignment = { horizontal: ra };
    });

    // ── 欄標題（第6列） ──
    ['A6','C6','E6'].forEach(a => { const cc = ws.getCell(a); cc.value='品項'; cc.font=FONT; });
    ['B6','D6','F6'].forEach(a => { const cc = ws.getCell(a); cc.value='單價'; cc.font=FONT; cc.alignment={horizontal:'center'}; });

    // ── 依類別收集品項，自動分配到欄位（一頁 A4 內） ──
    const MAX_ROWS = 40;  // 一欄最多幾列

    function catItems(catId) {
      return all_items_cache
        .filter(i => i.cat===catId && i.visible!==false)
        .map(item => [item.name, calcSell(item, all_items_cache)])
        .filter(x => x[1] > 0);
    }

    // 順序：截切 → 葉菜 → 瓜果 → 菇
    const allRows = [
      ...catItems('c4'),
      ...catItems('c1'),
      ...catItems('c2'),
      ...catItems('c3'),
    ];

    // 依 MAX_ROWS 切成多欄
    const cols = [];
    for (let i = 0; i < allRows.length; i += MAX_ROWS) {
      cols.push(allRows.slice(i, i + MAX_ROWS));
    }
    const numColPairs = Math.max(cols.length, 3);
    const maxLen = Math.max(...cols.map(x => x.length), 1);

    // 補足欄位設定（第4組以後）
    for (let ci = 3; ci < numColPairs; ci++) {
      ws.getColumn(ci*2 + 1).width = 26;
      ws.getColumn(ci*2 + 2).width = 9;

      // 表頭
      const nh = ws.getCell(6, ci*2 + 1); nh.value='品項'; nh.font=FONT;
      const ph = ws.getCell(6, ci*2 + 2); ph.value='單價'; ph.font=FONT; ph.alignment={horizontal:'center'};
    }

    // 填資料
    for (let i = 0; i < maxLen; i++) {
      const r = 7 + i;
      for (let ci = 0; ci < numColPairs; ci++) {
        const arr = cols[ci] || [];
        const nc = ci*2 + 1, pc = ci*2 + 2;
        const nCell = ws.getCell(r, nc);
        const pCell = ws.getCell(r, pc);
        nCell.font = FONT;
        pCell.font = FONT;
        if (arr[i]) {
          const nm = arr[i][0];
          let w = 0;
          for (const ch of nm) w += /[\u4e00-\u9fff\u3000-\u303f]/.test(ch) ? 2 : 1;
          nCell.value = nm;
          nCell.font = w > 16 ? { name: '新細明體', size: 14 } : FONT;
          nCell.alignment = { horizontal: 'left', vertical: 'middle', wrapText: false, shrinkToFit: false };
          pCell.value = arr[i][1];
          pCell.alignment = { horizontal: 'center', vertical: 'middle' };
        }
      }
    }

    // ── 框線：整個資料表格（第6列到最後一列，A~F欄） ──
    const lastRow = 6 + maxLen;
    for (let r = 7; r <= lastRow; r++) ws.getRow(r).height = 28.5;
    const lastCol = numColPairs * 2;
    for (let r = 6; r <= lastRow; r++) {
      for (let col = 1; col <= lastCol; col++) {
        const cell = ws.getCell(r, col);
        cell.border = {
          top:    { style: r === 6 ? 'medium' : 'thin' },
          bottom: { style: r === lastRow ? 'medium' : 'thin' },
          left:   { style: col === 1 ? 'medium' : 'thin' },
          right:  { style: col === lastCol ? 'medium' : 'thin' },
        };
      }
    }

    // ── QR code 圖片（放在 E3 附近，跟原始檔一致） ──
    try {
      const imgId = wb.addImage({ base64: QR_B64, extension: 'png' });
      // 原始檔位置：從 E3 到 F5（0-indexed col4 row2 → col5 row4）
      ws.addImage(imgId, {
        tl: { nativeCol: 4, nativeColOff: 806769, nativeRow: 2, nativeRowOff: 950 },
        ext: { width: 76, height: 76 }
      });
    } catch(e) { console.warn('QR 圖片加入失敗', e); }

    // ── 下載 ──
    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const dateFile = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${dateFile}.xlsx`;
    a.click();
    URL.revokeObjectURL(a.href);
  } catch(e) {
    alert('匯出失敗：' + e.message);
  } finally {
    btn.textContent = '📊 匯出 Excel'; btn.disabled = false;
  }
}

async function downloadImg() {
  const btn = document.getElementById('dl-btn');
  btn.textContent = '⏳ 產生中…'; btn.disabled = true;
  try {
    const canvas = await html2canvas(document.getElementById('app'), {scale:2,backgroundColor:'#ffffff',scrollY:-window.scrollY,windowWidth:794});
    const dataUrl = canvas.toDataURL('image/png');
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    if (isIOS) {
      const w = window.open();
      w.document.write(`<img src="${dataUrl}" style="max-width:100%;display:block"/><p style="text-align:center;font-family:sans-serif;color:#888;padding:10px">長按圖片儲存到相簿</p>`);
    } else {
      const d = new Date();
      const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = `採鮮農產行報價單_${dateStr}.png`;
      a.click();
    }
  } catch(e) { alert('失敗：'+e.message); }
  finally { btn.textContent = '📷 下載圖片'; btn.disabled = false; }
}
load();
</script>
