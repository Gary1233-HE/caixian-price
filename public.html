<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>採鮮農產行｜當日報價單</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC','PingFang TC',sans-serif;background:#f0f7e6;color:#1a2a1a;-webkit-font-smoothing:antialiased}
.page{max-width:1080px;margin:0 auto;background:#fffef8;min-height:100vh;padding:28px 24px 48px;box-shadow:0 0 24px rgba(0,0,0,.08)}

/* ── Header ── */
.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.shop-name{font-size:48px;font-weight:900;color:#66bb6a;letter-spacing:-.01em}
.shop-info{font-size:17px;color:#555;margin-top:10px;line-height:2.2}
.date-block{text-align:right}
.date-label{font-size:28px;font-weight:900;color:#333}
.date-value{font-size:17px;color:#555;margin-top:6px}
.date-note{font-size:15px;color:#d84315;margin-top:4px}
.updated{font-size:14px;color:#aaa;margin-top:4px}

/* ── 三欄 Grid ── */
.price-grid{display:grid;grid-template-columns:1fr 1fr 1fr;border:2px solid #b5d68a;border-radius:8px;overflow:hidden}
.price-col{border-right:2px solid #b5d68a;display:flex;flex-direction:column}
.price-col:last-child{border-right:none}

/* ── Category header ── */
.cat-hdr{padding:12px 14px;font-size:20px;font-weight:900;color:#fff;letter-spacing:.02em}
.col-lbl{display:flex;justify-content:space-between;padding:6px 14px;font-size:16px;font-weight:700;color:#7a8c6a;border-bottom:1px solid #d4edaa;background:#f5fae8;text-transform:uppercase;letter-spacing:.04em}

/* ── Item rows ── */
.item{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid #eef7dd;font-size:22px}
.item:last-child{border-bottom:none}
.item:nth-child(even){background:#fafef2}
.item-name{color:#2a3a1a;flex:1;padding-right:2px}
.item-price{white-space:nowrap;font-size:23px;color:#2a3a1a}
.item-price.up{color:#c62828}
.item-price.down{color:#1565c0}
.arrow{font-size:16px;margin-left:2px}

/* 截切與葉菜分隔 */
.cat-divider{border-top:2px solid #b5d68a}

/* ── Footer ── */
.footer{margin-top:20px;text-align:center;font-size:17px;color:#7a8c6a;line-height:2.2}
.footer-bold{font-weight:900;color:#3d8b37;font-size:20px}

/* ── 類別 header 顏色（田園亮色系） ── */
/* 葉菜：草綠  瓜果：南瓜橘  截切：青翠  菇：薰衣草紫 */

/* ── 手機：兩欄 ── */
@media(max-width:700px){
  .price-grid{grid-template-columns:1fr 1fr}
  .price-col:nth-child(2){border-right:none}
  .price-col:nth-child(3){border-top:2px solid #b5d68a;border-right:2px solid #b5d68a}
  .price-col:nth-child(4){border-top:2px solid #b5d68a;border-right:none}
}

.loading{text-align:center;padding:60px;color:#888;font-size:15px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<button id="dl-btn" onclick="downloadImg()">📷 下載圖片</button>
<div class="page" id="app"><div class="loading">載入中…</div></div>

<script>
const FB_PROJECT_ID = 'caixian-price-619c4';
const FB_API_KEY    = 'AIzaSyDyIgF1T3qwVUdxTtfuo9SRwpiEQpfMaIA';

function today() {
  const d = new Date();
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── 計算售價 ────────────────────────────────────────────────────────────────
function calcSell(item, all) {
  if (item.cat === 'c4' && item.srcId) return cutPrice(item, all);
  const cost = Number(item.cost)||0;
  if (!cost) return Number(item.price)||0;
  if (item.type==='manual') return Number(item.price)||0;
  if (item.type==='fixed')  return cost + (Number(item.markup)||0);
  return Math.round(cost * (1 + (Number(item.markup)||0) / 100));
}

function cutPrice(item, all) {
  const src = all.find(i => i.id === item.srcId);
  if (!src) return 0;
  if ((item.cutType||'whole') === 'whole') {
    const sp = calcSell(src, all);
    return sp ? Math.round(sp + (Number(item.cutFee)||0)) : 0;
  }
  // 散切：src 可能是整件切或原料，直接用其售價
  const base = calcSell(src, all);
  if (!base) return 0;
  const w = Number(item.srcWeight)||1;
  const y = Number(item.cutYield)||1;
  const a = Number(item.cutAddon)||0;
  return Math.round((base/w)/y + a);
}

// ── 建立品項列 ───────────────────────────────────────────────────────────────
function itemRow(item, all) {
  const sp   = calcSell(item, all);
  if (!sp) return ''; // 沒有金額不顯示
  const cls  = item.trend==='up' ? ' up' : item.trend==='down' ? ' down' : '';
  const arrow = item.trend==='up'   ? `<span class="arrow">↑</span>`
              : item.trend==='down' ? `<span class="arrow">↓</span>` : '';
  return `<div class="item"><span class="item-name">${esc(item.name)}</span><span class="item-price${cls}">${sp}${arrow}</span></div>`;
}

// ── 建立類別區塊 ─────────────────────────────────────────────────────────────
function catBlock(cat, all, divider) {
  const rows = all.filter(i => i.cat===cat.id && i.visible!==false && calcSell(i, all) > 0);
  if (!rows.length) return '';
  return `
    ${divider ? '<div class="cat-divider"></div>' : ''}
    <div class="cat-hdr" style="background:${esc(cat.color)}">${esc(cat.name)}</div>
    <div class="col-lbl"><span>品項</span><span>單價</span></div>
    ${rows.map(i => itemRow(i, all)).join('')}`;
}

// ── 渲染頁面 ─────────────────────────────────────────────────────────────────
function render(data) {
  const meta = data.meta  || {};
  const all  = data.items || [];
  const upd  = data.updatedAt ? new Date(data.updatedAt).toLocaleString('zh-TW') : '';

  // 欄位定義
  const COL_LEFT  = [{id:'c4',name:'🔪 蔬菜截切',color:'#00897b'},{id:'c1',name:'🥬 葉菜類',color:'#4caf50'}];
  const COL_MID   = [{id:'c2',name:'🍈 瓜果類',  color:'#ff8f00'}];
  const COL_RIGHT = [{id:'c3',name:'🍄 菇與其他',color:'#8d6e63'}];

  function buildCol(cats) {
    return cats.map((cat, i) => catBlock(cat, all, i > 0)).join('');
  }

  document.getElementById('app').innerHTML = `
    <div class="hdr">
      <div>
        <div class="shop-name">${esc(meta.name||'採鮮農產行')}</div>
        <div class="shop-info">
          聯絡人：${esc(meta.contact||'')}<br>
          手機：${esc(meta.phone||'')}<br>
          LINE：${esc(meta.line||'')}
        </div>
      </div>
      <div class="date-block">
        <div class="date-label">當日報價單</div>
        <div class="date-value">報價日期：${today()}</div>
        <div class="date-note">※ 本報價單以當日行情價為準</div>
        ${upd ? `<div class="updated">最後更新：${upd}</div>` : ''}
      </div>
    </div>

    <div class="price-grid">
      <div class="price-col">${buildCol(COL_LEFT)}</div>
      <div class="price-col">${buildCol(COL_MID)}</div>
      <div class="price-col">${buildCol(COL_RIGHT)}</div>
    </div>

    <div class="footer">
      <div>※ ${esc(meta.note||'價格以當日市場行情為準，如有異動恕不另行通知')}</div>
      <div class="footer-bold">感謝您的支持與愛護 🙏</div>
    </div>`;
}

// ── Firebase 載入 ────────────────────────────────────────────────────────────
async function load() {
  try {
    const app = firebase.apps[0] || firebase.initializeApp({
      apiKey: FB_API_KEY, projectId: FB_PROJECT_ID,
      authDomain: `${FB_PROJECT_ID}.firebaseapp.com`
    });
    app.firestore().collection('price_board').doc('current').onSnapshot(snap => {
      if (snap.exists) render(snap.data());
      else document.getElementById('app').innerHTML = '<div class="loading">尚無報價資料</div>';
    }, err => {
      document.getElementById('app').innerHTML = `<div class="loading">載入失敗：${err.message}</div>`;
    });
  } catch(e) {
    document.getElementById('app').innerHTML = `<div class="loading">錯誤：${e.message}</div>`;
  }
}
async function downloadImg() {
  const btn = document.getElementById('dl-btn');
  btn.textContent = '⏳ 產生中…'; btn.disabled = true;
  try {
    const canvas = await html2canvas(document.getElementById('app'), {scale:2,backgroundColor:'#ffffff',scrollY:-window.scrollY});
    const d = new Date();
    const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = `採鮮農產行報價單_${dateStr}.png`;
    a.click();
  } catch(e) { alert('失敗：'+e.message); }
  finally { btn.textContent = '📷 下載圖片'; btn.disabled = false; }
}
load();
</script>
</body>
</html>
