<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>採鮮農產行｜當日報價單</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC','PingFang TC',sans-serif;background:#d0d8e0;color:#1a1a2e;-webkit-font-smoothing:antialiased;min-height:100vh;padding:20px}

.page{width:794px;min-height:1123px;margin:0 auto;background:#fff;padding:24px 28px 32px;box-shadow:0 4px 24px rgba(0,0,0,.18)}

/* Header */
.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;padding-bottom:12px;border-bottom:3px solid #1a5276}
.shop-name{font-size:34px;font-weight:900;color:#1a5276;line-height:1}
.shop-info{font-size:13px;color:#555;margin-top:6px;line-height:1.9}
.date-block{text-align:right}
.date-label{font-size:17px;font-weight:900;color:#1a5276;letter-spacing:.05em}
.date-value{font-size:13px;color:#555;margin-top:4px}
.date-note{font-size:10px;color:#c0392b;margin-top:2px}
.updated{font-size:9px;color:#aaa;margin-top:2px}

/* 四欄 Grid */
.price-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1.5px solid #2980b9;border-radius:4px;overflow:hidden}
.price-col{border-right:1.5px solid #2980b9;display:flex;flex-direction:column}
.price-col:last-child{border-right:none}

.cat-hdr{padding:7px 10px;font-size:14px;font-weight:900;color:#fff;letter-spacing:.04em}
.col-lbl{display:flex;justify-content:space-between;padding:5px 10px;font-size:12px;font-weight:700;color:#666;border-bottom:1px solid #d6eaf8;background:#eaf4fd}
.item{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;border-bottom:1px solid #eaf4fd;font-size:14px}
.item:last-child{border-bottom:none}
.item:nth-child(even){background:#f8fbff}
.item-name{color:#1a1a2e;flex:1;padding-right:3px}
.item-price{white-space:nowrap;font-size:14px;color:#1a2a4a}
.item-price.up{color:#c0392b;font-weight:700}
.item-price.down{color:#1565c0;font-weight:700}
.arrow{font-size:10px}
.cat-divider{border-top:1.5px solid #2980b9}

.footer{margin-top:10px;text-align:center;font-size:10px;color:#888;line-height:2}
.footer-bold{font-weight:900;color:#1a5276;font-size:12px}

#dl-btn{position:fixed;top:16px;right:16px;z-index:999;background:#1a5276;color:#fff;border:none;border-radius:6px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);font-family:inherit}
#dl-btn:hover{background:#154360}
@media print{#dl-btn{display:none}body{background:#fff;padding:0}.page{box-shadow:none;width:100%}}
@media(max-width:600px){body{padding:0}.page{width:100%;padding:14px 10px}.price-grid{grid-template-columns:1fr 1fr}.price-col:nth-child(2){border-right:none}.price-col:nth-child(3){border-top:1.5px solid #2980b9}.price-col:nth-child(4){border-top:1.5px solid #2980b9;border-right:none}}
.loading{text-align:center;padding:60px;color:#888}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<button id="dl-btn" onclick="downloadImg()">📷 下載圖片</button>
<div class="page" id="app"><div class="loading">載入中…</div></div>

<script>
const FB_PROJECT_ID = 'caixian-price-619c4';
const FB_API_KEY    = 'AIzaSyDyIgF1T3qwVUdxTtfuo9SRwpiEQpfMaIA';

function today() {
  const d = new Date();
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── 計算售價 ────────────────────────────────────────────────────────────────

// 散售累進計算
function retailProgressiveAddon(base) {
  if (base <= 25) return base + 10;
  let rate;
  if (base <= 99)  rate = 1.45;
  else if (base <= 199) rate = 1.40;
  else rate = 1.35;
  const raw = base * rate;
  const b = Math.floor(raw / 10) * 10;
  const ones = raw - b;
  const targets = [0, 3, 5, 8, 10];
  const closest = targets.reduce((a, t) => Math.abs(ones - a) <= Math.abs(ones - t) ? a : t);
  return b + (closest === 10 ? 10 : closest);
}
function progressiveAddon(cost) {
  if (cost <= 330) return 100;
  const raw = cost * 0.3;
  const base = Math.floor(raw / 100) * 100;
  const ones = raw - base;
  const targets = [0, 30, 50, 80, 100];
  const closest = targets.reduce((a, b) => Math.abs(ones - a) <= Math.abs(ones - b) ? a : b);
  return base + (closest === 100 ? 100 : closest);
}

function calcSell(item, all) {
  if (item.cat === 'c4' && item.srcId) return cutPrice(item, all);
  const cost = Number(item.cost)||0;
  if (!cost) return Number(item.price)||0;
  if (item.type==='manual')      return Number(item.price)||0;
  if (item.type==='fixed')       return cost + (Number(item.markup)||0);
  if (item.type==='progressive')        return cost + progressiveAddon(cost);
  if (item.type==='retail-progressive') return retailProgressiveAddon(cost);
  return Math.round(cost * (1 + (Number(item.markup)||0)/100));
}

function cutPrice(item, all) {
  const src = all.find(i => i.id === item.srcId);
  if (!src) return 0;
  if ((item.cutType||'whole') === 'whole') {
    const sp = calcSell(src, all);
    return sp ? Math.round(sp + (Number(item.cutFee)||0)) : 0;
  }
  // 散切：src 可能是整件切或原料，直接用其售價
  const base = calcSell(src, all);
  if (!base) return 0;
  const w = Number(item.srcWeight)||1;
  const y = Number(item.cutYield)||1;
  const a = Number(item.cutAddon)||0;
  return Math.round((base/w)/y + a);
}

// ── 建立品項列 ───────────────────────────────────────────────────────────────
function itemRow(item, all) {
  const sp   = calcSell(item, all);
  if (!sp) return ''; // 沒有金額不顯示
  const cls  = item.trend==='up' ? ' up' : item.trend==='down' ? ' down' : '';
  const arrow = item.trend==='up'   ? `<span class="arrow">↑</span>`
              : item.trend==='down' ? `<span class="arrow">↓</span>` : '';
  return `<div class="item"><span class="item-name">${esc(item.name)}</span><span class="item-price${cls}">${sp}${arrow}</span></div>`;
}

// ── 建立類別區塊 ─────────────────────────────────────────────────────────────
function catBlock(cat, all, divider) {
  const rows = all.filter(i => i.cat===cat.id && i.visible!==false && calcSell(i, all) > 0);
  if (!rows.length) return '';
  return `
    ${divider ? '<div class="cat-divider"></div>' : ''}
    <div class="cat-hdr" style="background:${esc(cat.color)}">${esc(cat.name)}</div>
    <div class="col-lbl"><span>品項</span><span>單價</span></div>
    ${rows.map(i => itemRow(i, all)).join('')}`;
}

// ── 渲染頁面 ─────────────────────────────────────────────────────────────────
function render(data) {
  const meta = data.meta  || {};
  const all  = data.items || [];
  const upd  = data.updatedAt ? new Date(data.updatedAt).toLocaleString('zh-TW') : '';

  // 欄位定義
  const COL_LEFT  = [{id:'c4',name:'🔪 蔬菜截切',color:'#1a7a6e'},{id:'c1',name:'🥬 葉菜類',color:'#1e8449'}];
  const COL_MID   = [{id:'c2',name:'🍈 瓜果類',  color:'#d4ac0d'}];
  const COL_RIGHT = [{id:'c3',name:'🍄 菇與其他',color:'#7b241c'}];

  function buildCol(cats) {
    return cats.map((cat, i) => catBlock(cat, all, i > 0)).join('');
  }

  document.getElementById('app').innerHTML = `
    <div class="hdr">
      <div>
        <div class="shop-name">${esc(meta.name||'採鮮農產行')}</div>
        <div class="shop-info">
          聯絡人：${esc(meta.contact||'')}<br>
          手機：${esc(meta.phone||'')}<br>
          LINE：${esc(meta.line||'')}
        </div>
      </div>
      <div class="date-block">
        <div class="date-label">當日報價單</div>
        <div class="date-value">報價日期：${today()}</div>
        <div class="date-note">※ 本報價單以當日行情價為準</div>
        ${upd ? `<div class="updated">最後更新：${upd}</div>` : ''}
      </div>
    </div>

    <div class="price-grid">
      <div class="price-col">${buildCol([{id:'c4',name:'🔪 蔬菜截切',color:'#1a7a6e'}])}</div>
      <div class="price-col">${buildCol([{id:'c1',name:'🥬 葉菜類',color:'#1e8449'}])}</div>
      <div class="price-col">${buildCol([{id:'c2',name:'🍈 瓜果類',color:'#d4ac0d'}])}</div>
      <div class="price-col">${buildCol([{id:'c3',name:'🍄 菇與其他',color:'#7b241c'}])}</div>
    </div>

    <div class="footer">
      <div>※ ${esc(meta.note||'價格以當日市場行情為準，如有異動恕不另行通知')}</div>
      <div class="footer-bold">感謝您的支持與愛護 🙏</div>
    </div>`;
}

// ── Firebase 載入 ────────────────────────────────────────────────────────────
async function load() {
  try {
    const app = firebase.apps[0] || firebase.initializeApp({
      apiKey: FB_API_KEY, projectId: FB_PROJECT_ID,
      authDomain: `${FB_PROJECT_ID}.firebaseapp.com`
    });
    app.firestore().collection('price_board').doc('current').onSnapshot(snap => {
      if (snap.exists) render(snap.data());
      else document.getElementById('app').innerHTML = '<div class="loading">尚無報價資料</div>';
    }, err => {
      document.getElementById('app').innerHTML = `<div class="loading">載入失敗：${err.message}</div>`;
    });
  } catch(e) {
    document.getElementById('app').innerHTML = `<div class="loading">錯誤：${e.message}</div>`;
  }
}
async function downloadImg() {
  const btn = document.getElementById('dl-btn');
  btn.textContent = '⏳ 產生中…'; btn.disabled = true;
  try {
    const canvas = await html2canvas(document.getElementById('app'), {scale:2,backgroundColor:'#ffffff',scrollY:-window.scrollY,windowWidth:794});
    const dataUrl = canvas.toDataURL('image/png');
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    if (isIOS) {
      const w = window.open();
      w.document.write(`<img src="${dataUrl}" style="max-width:100%;display:block"/><p style="text-align:center;font-family:sans-serif;color:#888;padding:10px">長按圖片儲存到相簿</p>`);
    } else {
      const d = new Date();
      const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = `採鮮農產行報價單_${dateStr}.png`;
      a.click();
    }
  } catch(e) { alert('失敗：'+e.message); }
  finally { btn.textContent = '📷 下載圖片'; btn.disabled = false; }
}
load();
</script>
</body>
</html>
